name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Arm64 Debug APK
        run: ./gradlew :TMessagesProj_App:assembleArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HunterGram-APK
          path: TMessagesProj_App/build/outputs/apk/arm64/debug/*.apk
